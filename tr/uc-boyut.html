html[dir="rtl"]{ --f-mono: "IBM Plex Sans Arabic","IBM Plex Mono",monospace; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}

}
img,svg{max-width:100%}

.skip:focus{inset-inline-start:0}

/* ---------- üst bar ---------- */
.top{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topin{display:flex; align-items:center; gap:22px; height:62px}

.brand-mark svg{display:block; width:100%; height:100%}
.brand-txt{display:flex; align-items:baseline; gap:9px}
.brand b{font-size:19px; font-weight:600; letter-spacing:.20em}
.brand span{font-family:var(--f-mono); font-size:10px; letter-spacing:.14em;

nav.main{display:flex; gap:17px; margin-inline-start:auto; flex-wrap:wrap;

nav.main a{color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap}
nav.main a:hover,nav.main a[aria-current]{color:var(--ink)}
nav.main a[aria-current]{box-shadow:0 2px 0 var(--accent)}
.nav-grup{position:relative; display:inline-flex}
.nav-grup>a::after{content:"›"; display:inline-block; margin-inline-start:5px;
  transform:rotate(90deg); font-size:11px; opacity:.55}
.nav-alt{position:absolute; top:100%; inset-inline-start:-14px; min-width:190px;
  background:var(--surface); border:1px solid var(--line); padding:6px 0;
  display:none; flex-direction:column; z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.09)}
.nav-grup:hover .nav-alt,.nav-grup:focus-within .nav-alt{display:flex}
.nav-alt a{padding:8px 16px; font-size:13.5px; white-space:nowrap}
.nav-alt a:hover{background:var(--surface-2); color:var(--ink)}
.nav-alt .alt-baslik{padding:9px 16px 4px; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted-2,#9a9a9a); border-top:1px solid var(--line);
  margin-top:5px}
.nav-alt a.alt-ayrac{border-top:1px solid var(--line); margin-top:5px;
  padding-top:11px; color:var(--accent)}
@media(max-width:900px){
  .nav-grup>a::after{display:none}
  .nav-alt{display:none !important}
}
.langs{display:flex; gap:2px; flex:none; border:1px solid var(--line); padding:2px}
.langs a{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--faint); text-decoration:none; padding:4px 7px}
.langs a:hover{color:var(--ink)}
.langs a[aria-current]{background:var(--accent); color:#fff}

  .langs{margin-inline-start:0}
  .status .wrap{flex-direction:column; gap:10px}
}

/* ---------- durum şeridi ---------- */
.status{border-bottom:1px solid var(--line); background:var(--bg-2)}
.status .wrap{display:flex; gap:16px; align-items:flex-start; padding-block:13px}
.status b{font-family:var(--f-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--warn); border:1px solid var(--warn); padding:3px 8px; flex:none; margin-top:2px}
.status p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.55; max-width:88ch}

.lede{font-size:clamp(16px,1.6vw,18.5px); color:var(--muted); max-width:56ch; margin:0; line-height:1.6}

.herofig svg{width:100%; max-width:330px; max-height:430px; height:auto; color:var(--steel)}
