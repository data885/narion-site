name: reconstruct-3d-viewer
on:
  workflow_dispatch:
  push:
    branches: [feat/3d-lule-textures, feat/3d-missing-texture-sidecars]
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble texture .b64 sidecars from parts (keep viewer.js untouched)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          root = Path('gorsel/3d')
          # Do NOT rebuild viewer.js — leave lüle viewer on the branch/main intact.
          def decode_part(text: str) -> str:
              t = ''.join(text.split())
              if t.startswith('HEX:'):
                  return bytes.fromhex(t[4:]).decode('ascii')
              return t
          fixes_by_part = defaultdict(list)
          fp = root / 'texture-byte-fixes.json'
          if fp.exists():
              for item in json.loads(fp.read_text()):
                  fixes_by_part[item['part']].append(item)
          for name in ['ceviz_color.jpg.b64','ceviz_normal.jpg.b64','ceviz_roughness.jpg.b64',
                       'firca_normal.jpg.b64','firca_roughness.jpg.b64']:
              parts = sorted(root.glob(name + '.p*'))
              if not parts:
                  print('no texture parts', name)
                  continue
              chunks = []
              for p in parts:
                  data = decode_part(p.read_text())
                  for fx in sorted(fixes_by_part.get(p.name, []), key=lambda x: x['byte_offset']):
                      i = fx['byte_offset']
                      if i < len(data) and data[i] == fx['from']:
                          data = data[:i] + fx['to'] + data[i+1:]
                          print('applied fix', p.name, i, fx['from'], '->', fx['to'])
                      else:
                          print('fix skip/mismatch', p.name, fx)
                  chunks.append(data)
              out = ''.join(chunks)
              (root / name).write_text(out)
              print('texture', name, len(out), 'from', len(parts), 'parts')
          PY
      - name: Commit assembled texture sidecars
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gorsel/3d/*.jpg.b64 || true
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Assemble texture .b64 sidecars from split parts"
            git push
          fi
