name: reconstruct-3d-viewer
on:
  workflow_dispatch:
  push:
    branches: [feat/3d-lule-textures]
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-lule-textures
          fetch-depth: 0
      - name: Decode viewer.js from b64 parts + inject Lüle UI into locale HTML
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, glob, re
          from pathlib import Path

          def decode_parts(pattern, dest, min_parts=1):
              parts = sorted(glob.glob(pattern))
              if len(parts) < min_parts:
                  print('skip decode', dest, 'parts', len(parts), '<', min_parts)
                  return False
              data = ''.join(Path(p).read_text().strip() for p in parts)
              raw = base64.b64decode(data, validate=False)
              Path(dest).write_bytes(raw)
              print('wrote', dest, len(raw), 'from', len(parts), 'parts')
              return True

          decode_parts('gorsel/3d/uc-boyut-viewer.js.b64.p*', 'gorsel/3d/uc-boyut-viewer.js', min_parts=9)
          data = Path('gorsel/3d/uc-boyut-viewer.js').read_bytes()
          assert data.startswith(b'(function'), data[:40]
          assert b'ekleLule' in data, 'missing ekleLule'
          assert len(data) > 20000, len(data)

          # Assemble texture .b64 sidecars from split parts
          for name in ['ceviz_color.jpg.b64','ceviz_normal.jpg.b64','ceviz_roughness.jpg.b64',
                       'firca_normal.jpg.b64','firca_roughness.jpg.b64']:
              parts = sorted(Path('gorsel/3d').glob(name + '.p*'))
              if not parts:
                  print('no texture parts', name)
                  continue
              data = ''.join(pp.read_text().strip() for pp in parts)
              Path('gorsel/3d/' + name).write_text(data)
              print('texture', name, len(data), 'from', len(parts), 'parts')


          INSERTS = {
            'tr': ('Kaplama',
              '<div class="v3-grp"><span class="v3-lab">Lüle</span><div class="picks">'
              '<button type="button" class="pick" data-lule="takili" aria-pressed="true">takılı</button>'
              '<button type="button" class="pick" data-lule="cikik" aria-pressed="false">çıkık</button>'
              '</div></div>'),
            'en': ('Finish',
              '<div class="v3-grp"><span class="v3-lab">Bowl</span><div class="picks">'
              '<button type="button" class="pick" data-lule="takili" aria-pressed="true">fitted</button>'
              '<button type="button" class="pick" data-lule="cikik" aria-pressed="false">lifted</button>'
              '</div></div>'),
            'ar': ('التشطيب',
              '<div class="v3-grp"><span class="v3-lab">الرأس</span><div class="picks">'
              '<button type="button" class="pick" data-lule="takili" aria-pressed="true">مركّب</button>'
              '<button type="button" class="pick" data-lule="cikik" aria-pressed="false">مرفوع</button>'
              '</div></div>'),
            'ru': ('Покрытие',
              '<div class="v3-grp"><span class="v3-lab">Чаша</span><div class="picks">'
              '<button type="button" class="pick" data-lule="takili" aria-pressed="true">надета</button>'
              '<button type="button" class="pick" data-lule="cikik" aria-pressed="false">снята</button>'
              '</div></div>'),
          }

          for loc, (lab, block) in INSERTS.items():
              dest = Path(f'{loc}/uc-boyut.html')
              html = dest.read_text()
              if 'data-lule=' in html:
                  print(loc, 'already has lule')
                  continue
              marker = f'<span class="v3-lab">{lab}</span>'
              idx = html.find(marker)
              if idx < 0:
                  print('marker missing', loc, lab)
                  continue
              picks_end = html.find('</div></div>', idx)
              if picks_end < 0:
                  print('grp end missing', loc)
                  continue
              insert_at = picks_end + len('</div></div>')
              html2 = html[:insert_at] + '\n    ' + block + html[insert_at:]
              dest.write_text(html2)
              print('injected lule into', dest, len(html2))
          PY
      - name: Commit rebuilt artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gorsel/3d/uc-boyut-viewer.js gorsel/3d/*.jpg.b64 tr/uc-boyut.html en/uc-boyut.html ar/uc-boyut.html ru/uc-boyut.html || true
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Rebuild viewer.js from b64 parts + Lüle UI on locale HTML"
            git push
          fi
