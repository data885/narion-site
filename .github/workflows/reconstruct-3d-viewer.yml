name: reconstruct-3d-viewer
on:
  workflow_dispatch:
  push:
    branches: [feat/3d-studio-materials]
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-studio-materials
      - name: Decode viewer.js and locale HTML from b64 parts
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, glob
          from pathlib import Path

          def decode_parts(pattern, dest):
              parts = sorted(glob.glob(pattern))
              if not parts:
                  print('skip', dest, '(no parts)')
                  return False
              data = ''.join(Path(p).read_text().strip() for p in parts)
              raw = base64.b64decode(data)
              Path(dest).write_bytes(raw)
              print('wrote', dest, len(raw), 'from', len(parts), 'parts')
              return True

          ok = decode_parts('gorsel/3d/uc-boyut-viewer.js.b64.p*', 'gorsel/3d/uc-boyut-viewer.js')
          assert ok
          data = Path('gorsel/3d/uc-boyut-viewer.js').read_bytes()
          assert data.startswith(b'(function'), data[:40]
          assert len(data) > 20000, len(data)
          for loc in ['tr', 'en', 'ar', 'ru']:
              decode_parts(f'{loc}/uc-boyut.html.b64.p*', f'{loc}/uc-boyut.html')
          PY
      - name: Commit rebuilt artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gorsel/3d/uc-boyut-viewer.js tr/uc-boyut.html en/uc-boyut.html ar/uc-boyut.html ru/uc-boyut.html || true
          if git diff --cached --quiet; then
            echo "No change"
          else
            git status
            git commit -m "Rebuild viewer.js + locale HTML from b64 parts (studio HDRI + PBR)"
            git push
          fi
